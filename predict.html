<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mitigation Register Predictor — Canada EA Atlas</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#f5f6f8; color:#222; }
  header { background:#1a3a5c; color:#fff; padding:14px 20px; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  header h1 { font-size:1.15rem; }
  header a { color:#9fc3e8; font-size:.85rem; text-decoration:none; }
  #controls { background:#fff; border-bottom:1px solid #ddd; padding:12px 20px; display:flex; gap:22px; flex-wrap:wrap; align-items:flex-start; }
  .ctl label { display:block; font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; color:#888; margin-bottom:5px; }
  select { padding:6px 8px; font-size:.9rem; border:1px solid #ccc; border-radius:4px; }
  #constraints { display:flex; gap:12px; flex-wrap:wrap; padding-top:4px; }
  #constraints label { display:flex; gap:5px; font-size:.85rem; color:#333; text-transform:none; letter-spacing:0; align-items:center; }
  #meta { padding:12px 20px; font-size:.85rem; color:#555; }
  #register { padding:0 20px 40px; display:grid; gap:10px; max-width:980px; }
  .fam { background:#fff; border:1px solid #e2e4e8; border-radius:6px; padding:12px 14px; }
  .fam-head { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
  .badge { background:#1a3a5c; color:#fff; border-radius:10px; padding:2px 9px; font-size:.75rem; font-weight:600; }
  .disc { font-weight:600; }
  .mt { color:#666; font-size:.85rem; }
  .timing { font-size:.75rem; color:#946200; background:#fef3c7; border-radius:8px; padding:1px 7px; }
  .sample { font-size:.82rem; color:#444; margin-top:7px; line-height:1.4; border-left:3px solid #dbe4ee; padding-left:9px; }
  .examples { font-size:.75rem; color:#888; margin-top:6px; }
  .floor-note { font-size:.75rem; color:#1a6; }
</style>
</head>
<body>
<header>
  <h1>Mitigation Register Predictor</h1>
  <span style="font-size:.8rem;opacity:.8">precedent retrieval from 7,200+ classified EA conditions (BC · Federal · Ontario)</span>
  <a href="index.html">← back to map</a>
</header>

<div id="controls">
  <div class="ctl">
    <label for="arch">Project archetype</label>
    <select id="arch">
      <option value="mining">Mining</option>
      <option value="oil_gas">Oil &amp; Gas / LNG</option>
      <option value="transport">Transport / Port / Rail</option>
      <option value="hydro">Hydro / Dam</option>
      <option value="wind">Wind</option>
      <option value="solar">Solar</option>
      <option value="biogas">Biogas / AD</option>
      <option value="energy_other">Energy — other</option>
      <option value="waste">Waste / Landfill</option>
      <option value="water">Water / Wastewater</option>
      <option value="industrial">Industrial</option>
      <option value="other">Other</option>
    </select>
  </div>
  <div class="ctl">
    <label>Site constraints (from baseline screening)</label>
    <div id="constraints">
      <label><input type="checkbox" value="wetland"> wetland</label>
      <label><input type="checkbox" value="watercourse"> watercourse</label>
      <label><input type="checkbox" value="waterbody"> waterbody</label>
      <label><input type="checkbox" value="species_at_risk"> species at risk</label>
      <label><input type="checkbox" value="reserve"> reserve / treaty land</label>
      <label><input type="checkbox" value="ansi"> ANSI / significant area</label>
      <label><input type="checkbox" value="abandoned_mine"> abandoned mine</label>
    </div>
  </div>
</div>

<div id="meta">Loading…</div>
<div id="register"></div>

<script>
// mirrors scripts/mitigation_predict.py
const TRIGGER_MAP = {
  wetland: ['wetlands','surface_water'],
  watercourse: ['fish_fish_habitat','surface_water'],
  waterbody: ['fish_fish_habitat','surface_water'],
  species_at_risk: ['species_at_risk','wildlife_birds','vegetation_ecosystems'],
  reserve: ['indigenous_rights_tluse'],
  ansi: ['vegetation_ecosystems','species_at_risk'],
  abandoned_mine: ['soils_terrain','waste_hazmat'],
};
const FLOOR = ['indigenous_rights_tluse','accidents_malfunctions','archaeology_heritage'];
const ARCHETYPE_FLOOR = {
  mining: ['closure_postclosure','waste_hazmat','groundwater','surface_water'],
  oil_gas: ['accidents_malfunctions','climate_ghg','waste_hazmat'],
  waste: ['groundwater','waste_hazmat','air_quality'],
  hydro: ['fish_fish_habitat','surface_water'],
  wind: ['wildlife_birds','noise_vibration','closure_postclosure'],
  solar: ['vegetation_ecosystems','noise_vibration','closure_postclosure'],
  biogas: ['air_quality','waste_hazmat','surface_water'],
  transport: ['noise_vibration','surface_water','socio_economic'],
  nuclear: ['human_health','waste_hazmat','accidents_malfunctions'],
  industrial: ['air_quality','surface_water'],
};

let data = null;

async function load() {
  const arch = document.getElementById('arch').value;
  document.getElementById('meta').textContent = 'Loading…';
  try {
    const r = await fetch(`data/predictions/${arch}_register.json`);
    data = await r.json();
  } catch (e) {
    document.getElementById('meta').textContent = 'No register for this archetype yet.';
    data = null;
  }
  render();
}

function firedDisciplines() {
  const arch = document.getElementById('arch').value;
  const fired = new Set([...FLOOR, ...(ARCHETYPE_FLOOR[arch] || [])]);
  document.querySelectorAll('#constraints input:checked')
    .forEach(cb => (TRIGGER_MAP[cb.value] || []).forEach(d => fired.add(d)));
  return fired;
}

function render() {
  const reg = document.getElementById('register');
  reg.innerHTML = '';
  if (!data) return;
  const fired = firedDisciplines();
  const rows = data.strong_precedents.filter(f => fired.has(f.discipline));
  const nProj = new Set(rows.flatMap(r => r.examples)).size;
  document.getElementById('meta').textContent =
    `${rows.length} mitigation families predicted · disciplines fired: ` +
    [...fired].sort().join(', ');
  if (!rows.length) {
    reg.innerHTML = '<p style="color:#888;font-size:.9rem">No same-archetype precedents for the fired disciplines — try fewer constraints or a related archetype.</p>';
    return;
  }
  for (const f of rows) {
    const div = document.createElement('div');
    div.className = 'fam';
    div.innerHTML = `
      <div class="fam-head">
        <span class="badge">${f.precedent_projects} project${f.precedent_projects !== 1 ? 's' : ''}</span>
        <span class="disc">${f.discipline.replace(/_/g, ' ')}</span>
        <span class="mt">${f.measure_type.replace(/_/g, ' ')}</span>
        ${f.typical_timing ? `<span class="timing">${f.typical_timing.replace(/_/g, ' ')}</span>` : ''}
      </div>
      <div class="sample">“${(f.sample_condition || '').replace(/</g,'&lt;')}…”</div>
      <div class="examples">precedents: ${f.examples.join(' · ')}</div>`;
    reg.appendChild(div);
  }
}

document.getElementById('arch').addEventListener('change', load);
document.querySelectorAll('#constraints input').forEach(cb => cb.addEventListener('change', render));
load();
</script>
</body>
</html>
