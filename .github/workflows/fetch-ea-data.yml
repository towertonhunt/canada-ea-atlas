name: Fetch EA registry data

on:
  workflow_dispatch:
  push:
    branches: [claude/mac-mini-connection-ceehl5]
    paths: ['.github/workflows/fetch-ea-data.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Results site.js and show search/facet logic
        continue-on-error: true
        run: |
          mkdir -p data/raw
          curl -sL --retry 3 "https://iaac-aeic.gc.ca/050/evaluations/Scripts/PublicViews/Results/site.js" -o data/raw/iaac_results_site.js
          wc -c data/raw/iaac_results_site.js
          grep -nE "function Search|\.post\(|\.ajax\(|api-|facets\[|currentPage" data/raw/iaac_results_site.js | head -40 || true

      - name: Probe results-list API endpoints
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import json, urllib.request, urllib.parse, http.cookiejar

          cj = http.cookiejar.CookieJar()
          op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          op.addheaders = [('User-Agent', 'Mozilla/5.0'), ('Accept-Language', 'en-CA,en;q=0.9')]
          page_url = 'https://iaac-aeic.gc.ca/050/evaluations/exploration?culture=en-CA'
          op.open(page_url, timeout=60).read()

          base = 'https://iaac-aeic.gc.ca/050/evaluations/exploration/'
          fields = {'search': '', 'source': 'IAAC-AEIC', 'currentPage': '2'}
          for ep in ('api-results', 'api-list', 'api-search', 'api-projects', 'api-page'):
              try:
                  req = urllib.request.Request(base + ep,
                        data=urllib.parse.urlencode(fields).encode(),
                        headers={'Referer': page_url, 'X-Requested-With': 'XMLHttpRequest'})
                  resp = op.open(req, timeout=60).read().decode('utf-8', 'replace')
                  print(ep, '->', len(resp), 'bytes, head:', resp[:150].replace('\n', ' '))
              except Exception as e:
                  print(ep, 'FAIL', e)
          EOF

      - name: Commit data to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git pull --rebase origin claude/mac-mini-connection-ceehl5 || true
            git add data/raw
            git commit -m "Add phase-17 IAAC results site.js and endpoint probes [skip ci]" || echo "nothing to commit"
            git push && break
            sleep 5
          done
