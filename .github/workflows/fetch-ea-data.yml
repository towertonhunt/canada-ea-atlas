name: Fetch EA registry data

on:
  workflow_dispatch:
  push:
    branches: [claude/mac-mini-connection-ceehl5]
    paths: ['.github/workflows/fetch-ea-data.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch IAAC results JS to locate data API
        run: |
          mkdir -p data/raw
          curl -sL --max-time 60 "https://iaac-aeic.gc.ca/050/evaluations/Scripts/PublicViews/Results/site.js" -o data/raw/iaac_site.js || true
          curl -sL --max-time 60 "https://iaac-aeic.gc.ca/050/evaluations/Scripts/PublicViews/Results/functions.js" -o data/raw/iaac_functions.js || true
          curl -sL --max-time 60 "https://iaac-aeic.gc.ca/050/evaluations/Scripts/PublicViews/Results/azure-map-config-en.js" -o data/raw/iaac_map_config.js || true
          wc -c data/raw/iaac_*.js
          echo "== candidate endpoints =="
          grep -ohE '"[^"]*(exploration|search|api|json|Index)[^"]*"' data/raw/iaac_*.js | sort -u | head -40 || true

      - name: Commit data to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin claude/mac-mini-connection-ceehl5 || true
          git add data/raw
          git commit -m "Add phase-8 IAAC JS files [skip ci]" || echo "nothing to commit"
          git push
