name: Fetch EA registry data

on:
  workflow_dispatch:
  push:
    branches: [claude/mac-mini-connection-ceehl5]
    paths: ['.github/workflows/fetch-ea-data.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch federal inventory via sequential objectIds
        run: |
          mkdir -p data/raw
          python3 - <<'EOF'
          import json, urllib.request

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              return json.loads(urllib.request.urlopen(req, timeout=120).read())

          base = "https://maps-cartes.services.geo.ca/server_serveur/rest/services/IAAC/assessment_inventory_en/MapServer"
          # probe single-record query first
          t = get(f"{base}/0/query?objectIds=1&outFields=*&f=json")
          print('single-id probe:', str(t)[:250])
          if 'error' in t:
              print('objectIds approach dead too')
              raise SystemExit(0)
          for lid in (0, 1, 2):
              feats, empty_run, oid = [], 0, 1
              while empty_run < 5:  # stop after 5 consecutive empty batches
                  batch = ','.join(str(i) for i in range(oid, oid + 100))
                  d = get(f"{base}/{lid}/query?objectIds={batch}&outFields=*&f=json")
                  fs = d.get('features', []) if 'error' not in d else []
                  if fs:
                      empty_run = 0
                      for f in fs:
                          a = f['attributes']
                          lat, lon = a.get('latitude'), a.get('longitude')
                          try:
                              lat, lon = float(lat), float(lon)
                              geom = {'type': 'Point', 'coordinates': [lon, lat]}
                          except (TypeError, ValueError):
                              geom = None
                          feats.append({'type': 'Feature', 'geometry': geom,
                                        'properties': a})
                  else:
                      empty_run += 1
                  oid += 100
              print(f'layer {lid}: {len(feats)} features (stopped at oid {oid})')
              json.dump({'type': 'FeatureCollection', 'features': feats},
                        open(f'data/raw/federal_layer{lid}.geojson', 'w'))
          EOF

      - name: Fetch Quebec project map pages for coordinates
        run: |
          python3 - <<'EOF'
          import re, json, urllib.request, time

          h = open('data/raw/qc_ree_resultats.html', encoding='utf-8', errors='replace').read()
          dossiers = sorted(set(re.findall(r'carte\.asp\?no_dossier=([^"&]+)', h)))
          print('dossiers with map pages:', len(dossiers))
          out, saved_sample = {}, 0
          for i, d in enumerate(dossiers):
              url = f"https://www.ree.environnement.gouv.qc.ca/carte.asp?no_dossier={d}"
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  page = urllib.request.urlopen(req, timeout=30).read().decode('utf-8', 'replace')
              except Exception as e:
                  print('FAIL', d, e)
                  continue
              if saved_sample < 2:
                  open(f'data/raw/qc_carte_sample{saved_sample}.html', 'w').write(page)
                  saved_sample += 1
              # look for decimal coordinate pairs in the page/JS
              m = (re.search(r'LatLng\(\s*(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)\s*\)', page) or
                   re.search(r'lat[^-\d]{0,10}(-?\d+\.\d+)[^-\d]{0,20}(?:lon|lng)[^-\d]{0,10}(-?\d+\.\d+)', page, re.I) or
                   re.search(r'(-?\d{2}\.\d{3,})\s*[,;]\s*(-?\d{2,3}\.\d{3,})', page))
              if m:
                  out[d] = [float(m.group(1)), float(m.group(2))]
              if i % 50 == 0:
                  print(i, 'done,', len(out), 'with coords')
                  time.sleep(1)
          json.dump(out, open('data/raw/qc_coords.json', 'w'))
          print('total with coords:', len(out))
          EOF

      - name: Commit data to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin claude/mac-mini-connection-ceehl5 || true
          git add data/raw
          git commit -m "Add phase-6 data (federal via objectIds probe, QC coordinates) [skip ci]" || echo "nothing to commit"
          git push
