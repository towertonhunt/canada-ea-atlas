name: Fetch EA registry data

on:
  workflow_dispatch:
  push:
    branches: [claude/mac-mini-connection-ceehl5]
    paths: ['.github/workflows/fetch-ea-data.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch federal GeoJSON partitioned by province
        continue-on-error: true
        run: |
          mkdir -p data/raw
          python3 - <<'EOF'
          import json, time, urllib.request, urllib.parse, http.cookiejar

          cj = http.cookiejar.CookieJar()
          op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          op.addheaders = [('User-Agent', 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'),
                           ('Accept-Language', 'en-CA,en;q=0.9')]
          page_url = 'https://iaac-aeic.gc.ca/050/evaluations/exploration?culture=en-CA'
          op.open(page_url, timeout=60).read()
          api = 'https://iaac-aeic.gc.ca/050/evaluations/exploration/api-map'

          def fetch(extra):
              fields = {'search': '', 'source': 'IAAC-AEIC'}
              fields.update(extra)
              body = urllib.parse.urlencode(fields).encode()
              req = urllib.request.Request(api, data=body, headers={
                  'Referer': page_url, 'X-Requested-With': 'XMLHttpRequest'})
              resp = op.open(req, timeout=300).read().decode('utf-8', 'replace')
              d = json.loads(resp)
              if isinstance(d, str):
                  d = json.loads(d)
              return d.get('features', [])

          seen = {}
          base = fetch({})
          for f in base:
              seen[f['properties']['index_id']] = f
          print('base:', len(base), 'unique:', len(seen))

          for prov in ('AB','BC','MB','NB','NL','NS','NT','NU','ON','PE','QC','SK','YT'):
              try:
                  fs = fetch({'facets[province_codes]': prov})
                  new = 0
                  for f in fs:
                      k = f['properties']['index_id']
                      if k not in seen:
                          seen[k] = f
                          new += 1
                  print(prov, ':', len(fs), 'returned,', new, 'new, total', len(seen))
              except Exception as e:
                  print(prov, 'FAIL', e)
              time.sleep(2)

          json.dump({'type': 'FeatureCollection', 'features': list(seen.values())},
                    open('data/raw/federal_apimap.geojson', 'w'))
          print('FINAL federal total:', len(seen))
          EOF

      - name: Commit data to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git pull --rebase origin claude/mac-mini-connection-ceehl5 || true
            git add data/raw
            git commit -m "Add phase-16 federal GeoJSON partitioned by province [skip ci]" || echo "nothing to commit"
            git push && break
            sleep 5
          done
