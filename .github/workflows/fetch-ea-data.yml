name: Fetch EA registry data

on:
  workflow_dispatch:
  push:
    branches: [claude/mac-mini-connection-ceehl5]
    paths: ['.github/workflows/fetch-ea-data.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recon exploration/api and wildcard api-map
        continue-on-error: true
        run: |
          mkdir -p data/raw
          python3 - <<'EOF'
          import json, urllib.request, urllib.parse, http.cookiejar

          import time

          cj = http.cookiejar.CookieJar()
          op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          op.addheaders = [('User-Agent', 'Mozilla/5.0'), ('Accept-Language', 'en-CA,en;q=0.9')]
          page_url = 'https://iaac-aeic.gc.ca/050/evaluations/exploration?culture=en-CA'
          for attempt in range(8):
              try:
                  op.open(page_url, timeout=60).read()
                  print('page loaded on attempt', attempt)
                  break
              except Exception as e:
                  print('page attempt', attempt, 'FAIL', e)
                  time.sleep(20)
          else:
              raise SystemExit(0)

          def post(url, fields):
              req = urllib.request.Request(url, data=urllib.parse.urlencode(fields).encode(),
                    headers={'Referer': page_url, 'X-Requested-With': 'XMLHttpRequest'})
              return op.open(req, timeout=300).read().decode('utf-8', 'replace')

          # 1) list API, page 1
          try:
              resp = post('https://iaac-aeic.gc.ca/050/evaluations/exploration/api',
                          {'search': '*', 'facets': '', 'sort': '', 'page': '1',
                           'dateFilter': '', 'projectID': '', 'useMap': 'false',
                           'projectDocuments': 'false', 'activeProjects': 'false',
                           'inactiveProjects': 'false', 'isFedLands': 'false',
                           'usingPermitCoordination': 'false', 'dataFiles': 'false',
                           'mostRecent': 'false'})
              print('list api bytes:', len(resp))
              d = json.loads(resp)
              if isinstance(d, str):
                  d = json.loads(d)
              print('keys:', list(d.keys()) if isinstance(d, dict) else type(d))
              if isinstance(d, dict):
                  print('Count:', d.get('Count'))
                  for k in d:
                      v = d[k]
                      print(' -', k, type(v).__name__,
                            len(v) if isinstance(v, (list, dict, str)) else v)
                  open('data/raw/federal_listapi_p1.json', 'w').write(json.dumps(d)[:2000000])
          except Exception as e:
              print('list api FAIL', e)

          # 2) map API with wildcard
          try:
              resp = post('https://iaac-aeic.gc.ca/050/evaluations/exploration/api-map',
                          {'search': '*', 'source': 'IAAC-AEIC'})
              d = json.loads(resp)
              if isinstance(d, str):
                  d = json.loads(d)
              feats = d.get('features', [])
              print('api-map wildcard FEATURES:', len(feats))
              if len(feats) > 1000:
                  json.dump(d, open('data/raw/federal_apimap.geojson', 'w'))
                  print('saved larger federal set')
          except Exception as e:
              print('api-map wildcard FAIL', e)
          EOF

      - name: Commit data to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git pull --rebase origin claude/mac-mini-connection-ceehl5 || true
            git add data/raw
            git commit -m "Add phase-18 exploration/api recon [skip ci]" || echo "nothing to commit"
            git push && break
            sleep 5
          done
