name: Fetch EA registry data

on:
  workflow_dispatch:
  push:
    branches: [claude/mac-mini-connection-ceehl5]
    paths: ['.github/workflows/fetch-ea-data.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Federal - spatial envelope query
        run: |
          mkdir -p data/raw
          python3 - <<'EOF'
          import json, urllib.request, urllib.parse

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              return json.loads(urllib.request.urlopen(req, timeout=180).read())

          base = "https://maps-cartes.services.geo.ca/server_serveur/rest/services/IAAC/assessment_inventory_en/MapServer"
          geo = urllib.parse.quote('{"xmin":-180,"ymin":30,"xmax":-40,"ymax":90,"spatialReference":{"wkid":4326}}')
          for lid in (0, 1, 2):
              q = (f"{base}/{lid}/query?geometry={geo}&geometryType=esriGeometryEnvelope"
                   f"&inSR=4326&spatialRel=esriSpatialRelIntersects&outFields=*"
                   f"&returnGeometry=false&f=json")
              try:
                  d = get(q)
              except Exception as e:
                  print(f'layer {lid} EXC: {e}')
                  continue
              if 'error' in d:
                  print(f'layer {lid} error: {str(d)[:200]}')
                  continue
              feats = []
              for f in d.get('features', []):
                  a = f['attributes']
                  try:
                      lat, lon = float(a.get('latitude')), float(a.get('longitude'))
                      geom = {'type': 'Point', 'coordinates': [lon, lat]}
                  except (TypeError, ValueError):
                      geom = None
                  feats.append({'type': 'Feature', 'geometry': geom, 'properties': a})
              print(f'layer {lid}: {len(feats)} features, exceeded={d.get("exceededTransferLimit")}')
              json.dump({'type': 'FeatureCollection', 'features': feats},
                        open(f'data/raw/federal_layer{lid}.geojson', 'w'))
          EOF

      - name: Federal - GeoCore API probe
        run: |
          curl -sL --max-time 60 "https://geocore.api.geo.ca/id?id=f4c51eaa-a6ca-48b9-a1fc-b0651da20509&lang=en" -o data/raw/federal_geocore.json || true
          head -c 400 data/raw/federal_geocore.json; echo

      - name: Federal - registry site listing probe
        run: |
          curl -sL --max-time 60 "https://iaac-aeic.gc.ca/050/evaluations/exploration" -o data/raw/iaac_exploration_p1.html || true
          wc -c data/raw/iaac_exploration_p1.html
          grep -oiE 'of [0-9,]+ (results|records)' data/raw/iaac_exploration_p1.html | head -3 || true

      - name: Commit data to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin claude/mac-mini-connection-ceehl5 || true
          git add data/raw
          git commit -m "Add phase-7 federal data attempts (spatial query, geocore, site) [skip ci]" || echo "nothing to commit"
          git push
