name: Fetch EA registry data

on:
  workflow_dispatch:
  push:
    branches: [claude/mac-mini-connection-ceehl5]
    paths: ['.github/workflows/fetch-ea-data.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch full federal GeoJSON (double-decoded)
        continue-on-error: true
        run: |
          mkdir -p data/raw
          python3 - <<'EOF'
          import json, urllib.request, urllib.parse, http.cookiejar

          cj = http.cookiejar.CookieJar()
          op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          op.addheaders = [('User-Agent', 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'),
                           ('Accept-Language', 'en-CA,en;q=0.9')]
          page_url = 'https://iaac-aeic.gc.ca/050/evaluations/exploration?culture=en-CA'
          op.open(page_url, timeout=60).read()

          api = 'https://iaac-aeic.gc.ca/050/evaluations/exploration/api-map'
          body = urllib.parse.urlencode({'search': '', 'source': 'IAAC-AEIC'}).encode()
          req = urllib.request.Request(api, data=body, headers={
              'Referer': page_url, 'X-Requested-With': 'XMLHttpRequest'})
          resp = op.open(req, timeout=300).read().decode('utf-8', 'replace')
          print('raw bytes:', len(resp))
          d = json.loads(resp)
          if isinstance(d, str):   # API double-encodes the GeoJSON
              d = json.loads(d)
          feats = d.get('features', [])
          print('FEATURES:', len(feats))
          if feats:
              print('sample:', json.dumps(feats[0], ensure_ascii=False)[:600])
              json.dump(d, open('data/raw/federal_apimap.geojson', 'w'))
          EOF

      - name: Fetch Quebec projet.asp sample
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import re, time, urllib.request
          h = open('data/raw/qc_ree_resultats.html', encoding='utf-8', errors='replace').read()
          d = sorted(set(re.findall(r'projet\.asp\?no_dossier=([^"&]+)', h)))[0]
          url = f"https://www.ree.environnement.gouv.qc.ca/projet.asp?no_dossier={d}"
          for attempt in range(4):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  page = urllib.request.urlopen(req, timeout=60).read().decode('utf-8', 'replace')
                  open('data/raw/qc_projet_sample.html', 'w').write(page)
                  print('saved projet for', d, len(page), 'bytes')
                  print('pdf links:', re.findall(r'href="([^"]+\.(?:pdf|PDF)[^"]*)"', page)[:8])
                  break
              except Exception as e:
                  print('attempt', attempt, 'FAIL', e)
                  time.sleep(10)
          EOF

      - name: Commit data to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git pull --rebase origin claude/mac-mini-connection-ceehl5 || true
            git add data/raw
            git commit -m "Add phase-15 data (full federal GeoJSON, QC projet sample) [skip ci]" || echo "nothing to commit"
            git push && break
            sleep 5
          done
