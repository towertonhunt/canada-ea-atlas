name: Fetch EA registry data

on:
  workflow_dispatch:
  push:
    branches: [claude/mac-mini-connection-ceehl5]
    paths: ['.github/workflows/fetch-ea-data.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch federal api-map (retries + culture fallback)
        continue-on-error: true
        run: |
          mkdir -p data/raw
          python3 - <<'EOF'
          import json, re, time, urllib.request, urllib.parse, http.cookiejar

          cj = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          opener.addheaders = [('User-Agent', 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'),
                               ('Accept-Language', 'en-CA,en;q=0.9')]

          page, page_url = None, None
          for u in ('https://iaac-aeic.gc.ca/050/evaluations/exploration?culture=en-CA',
                    'https://iaac-aeic.gc.ca/050/evaluations/exploration',
                    'https://iaac-aeic.gc.ca/050/evaluations'):
              for attempt in range(3):
                  try:
                      page = opener.open(u, timeout=60).read().decode('utf-8', 'replace')
                      page_url = u
                      break
                  except Exception as e:
                      print('page fetch fail', u, attempt, e)
                      time.sleep(5)
              if page:
                  break
          if not page:
              print('could not load any exploration page')
              raise SystemExit(0)
          print('loaded', page_url, len(page), 'bytes; cookies:', [c.name for c in cj])
          tok = re.search(r'name="__RequestVerificationToken"[^>]*value="([^"]+)"', page)

          fields = {'search': '', 'facets': '', 'source': 'IAAC-AEIC',
                    'dateFilter': '', 'projectID': '', 'useMap': 'false',
                    'projectDocuments': '', 'activeProjects': 'true',
                    'inactiveProjects': 'true', 'mostRecent': 'false'}
          if tok:
              fields['__RequestVerificationToken'] = tok.group(1)

          for url in ('https://iaac-aeic.gc.ca/050/evaluations/exploration/api-map?culture=en-CA',
                      'https://iaac-aeic.gc.ca/050/evaluations/exploration/api-map'):
              try:
                  body = urllib.parse.urlencode(fields).encode()
                  req = urllib.request.Request(url, data=body, headers={
                      'Referer': page_url, 'X-Requested-With': 'XMLHttpRequest'})
                  resp = opener.open(req, timeout=180).read().decode('utf-8', 'replace')
                  print(url, '->', len(resp), 'bytes; head:', resp[:100].replace('\n', ' '))
                  d = json.loads(resp)
                  feats = d.get('features', [])
                  print('FEATURES:', len(feats))
                  if feats:
                      open('data/raw/federal_apimap.geojson', 'w').write(resp)
                      break
              except Exception as e:
                  print(url, 'FAIL', e)
          EOF

      - name: Probe BC EPIC document API
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import json, urllib.request

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              return json.loads(urllib.request.urlopen(req, timeout=60).read())

          bc = json.load(open('data/raw/bc_epic_projects.json'))[0]['searchResults']
          pid = bc[0]['_id']
          print('probe project:', pid, bc[0]['name'])
          for url in (
              f"https://projects.eao.gov.bc.ca/api/public/search?dataset=Document&project={pid}&pageSize=5&pageNum=0",
              f"https://projects.eao.gov.bc.ca/api/v2/search?dataset=Document&project={pid}&pageSize=5",
          ):
              try:
                  d = get(url)
                  print(url[:80], '-> OK')
                  print(json.dumps(d)[:800])
                  open('data/raw/bc_doc_probe.json', 'w').write(json.dumps(d))
                  break
              except Exception as e:
                  print(url[:80], 'FAIL', e)
          EOF

      - name: Fetch one Quebec fiche page
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import re, urllib.request
          h = open('data/raw/qc_ree_resultats.html', encoding='utf-8', errors='replace').read()
          d = sorted(set(re.findall(r'no_dossier=([^"&]+)', h)))[0]
          url = f"https://www.ree.environnement.gouv.qc.ca/fiche.asp?no_dossier={d}"
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          page = urllib.request.urlopen(req, timeout=60).read().decode('utf-8', 'replace')
          open('data/raw/qc_fiche_sample.html', 'w').write(page)
          print('saved fiche for', d, len(page), 'bytes')
          links = re.findall(r'href="([^"]+\.(?:pdf|PDF)[^"]*)"', page)
          print('pdf links:', len(links), links[:5])
          EOF

      - name: Ontario provincial EA recon (ERO + ontario.ca lists)
        continue-on-error: true
        run: |
          curl -sL --max-time 60 "https://ero.ontario.ca/search?search=environmental+assessment" -o data/raw/on_ero_search.html || true
          curl -sL --max-time 60 "https://www.ontario.ca/page/environmental-assessments" -o data/raw/on_ea_hub.html || true
          curl -sL --max-time 60 "https://www.ontario.ca/page/class-environmental-assessments" -o data/raw/on_class_ea.html || true
          curl -sL --max-time 60 "https://www.ontario.ca/page/current-and-completed-environmental-assessments" -o data/raw/on_current_ea.html || true
          for f in data/raw/on_*.html; do
            echo "$f: $(wc -c < $f) bytes, title: $(grep -oE '<title>[^<]*' $f | head -1)"
          done

      - name: Commit data to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git pull --rebase origin claude/mac-mini-connection-ceehl5 || true
            git add data/raw
            git commit -m "Add phase-13 data (federal retry, BC/QC doc recon, Ontario EA recon) [skip ci]" || echo "nothing to commit"
            git push && break
            sleep 5
          done
