name: Fetch EA registry data

on:
  workflow_dispatch:
  push:
    branches: [claude/mac-mini-connection-ceehl5]
    paths: ['.github/workflows/fetch-ea-data.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch federal assessment inventory (objectIds batching)
        run: |
          mkdir -p data/raw
          python3 - <<'EOF'
          import json, urllib.request

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              return json.loads(urllib.request.urlopen(req, timeout=120).read())

          base = "https://maps-cartes.services.geo.ca/server_serveur/rest/services/IAAC/assessment_inventory_en/MapServer"
          for lid in (0, 1, 2):
              ids_resp = get(f"{base}/{lid}/query?where=1%3D1&returnIdsOnly=true&f=json")
              if 'error' in ids_resp:
                  print(f'layer {lid} ids error: {str(ids_resp)[:300]}')
                  continue
              oid_field = ids_resp.get('objectIdFieldName', 'OBJECTID')
              ids = ids_resp.get('objectIds') or []
              print(f'layer {lid}: {len(ids)} object ids (field {oid_field})')
              feats = []
              for i in range(0, len(ids), 100):
                  batch = ','.join(map(str, ids[i:i+100]))
                  q = (f"{base}/{lid}/query?objectIds={batch}&outFields=*&outSR=4326"
                       f"&returnGeometry=true&f=json")
                  esri = get(q)
                  if 'error' in esri:
                      print(f'layer {lid} batch {i} error: {str(esri)[:200]}')
                      continue
                  for f in esri.get('features', []):
                      g = f.get('geometry')
                      feats.append({'type': 'Feature',
                                    'geometry': ({'type': 'Point',
                                                  'coordinates': [g['x'], g['y']]} if g else None),
                                    'properties': f['attributes']})
              print(f'layer {lid}: fetched {len(feats)} features')
              json.dump({'type': 'FeatureCollection', 'features': feats},
                        open(f'data/raw/federal_layer{lid}.geojson', 'w'))
          EOF

      - name: Probe Quebec REE registry site
        run: |
          curl -sL --max-time 60 "https://www.ree.environnement.gouv.qc.ca/index.asp" -o data/raw/qc_ree_home.html || true
          curl -sL --max-time 60 "https://www.ree.environnement.gouv.qc.ca/liste.asp" -o data/raw/qc_ree_liste.html || true
          ls -la data/raw/qc_ree_* || true

      - name: Commit data to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin claude/mac-mini-connection-ceehl5 || true
          git add data/raw
          git commit -m "Add phase-4 EA registry data (federal objectIds, QC REE probe) [skip ci]" || echo "nothing to commit"
          git push
