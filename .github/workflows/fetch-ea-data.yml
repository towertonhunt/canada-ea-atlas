name: Fetch EA registry data

on:
  workflow_dispatch:
  push:
    branches: [claude/mac-mini-connection-ceehl5]
    paths: ['.github/workflows/fetch-ea-data.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch federal api-map with session cookies and token
        run: |
          mkdir -p data/raw
          python3 - <<'EOF'
          import json, re, urllib.request, urllib.parse, http.cookiejar

          cj = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          opener.addheaders = [('User-Agent', 'Mozilla/5.0'),
                               ('X-Requested-With', 'XMLHttpRequest')]

          page = opener.open('https://iaac-aeic.gc.ca/050/evaluations/exploration', timeout=60).read().decode('utf-8', 'replace')
          tok = re.search(r'name="__RequestVerificationToken"[^>]*value="([^"]+)"', page)
          print('cookies:', [c.name for c in cj], '| token:', bool(tok))

          fields = {'search': '', 'facets': '', 'source': 'IAAC-AEIC',
                    'dateFilter': '', 'projectID': '', 'useMap': 'false',
                    'projectDocuments': '', 'activeProjects': 'true',
                    'inactiveProjects': 'true', 'mostRecent': 'false'}
          if tok:
              fields['__RequestVerificationToken'] = tok.group(1)

          for url in ('https://iaac-aeic.gc.ca/050/evaluations/exploration/api-map',
                      'https://iaac-aeic.gc.ca/050/evaluations/exploration/api-map?culture=en-CA',
                      'https://iaac-aeic.gc.ca/050/evaluations/api-map'):
              try:
                  body = urllib.parse.urlencode(fields).encode()
                  req = urllib.request.Request(url, data=body,
                        headers={'Referer': 'https://iaac-aeic.gc.ca/050/evaluations/exploration'})
                  resp = opener.open(req, timeout=180).read().decode('utf-8', 'replace')
                  print(url, '->', len(resp), 'bytes, head:', resp[:120].replace('\n', ' '))
                  try:
                      d = json.loads(resp)
                      feats = d.get('features', [])
                      print('   FEATURES:', len(feats))
                      if feats:
                          open('data/raw/federal_apimap.geojson', 'w').write(resp)
                          print('   sample:', json.dumps(feats[0])[:400])
                          break
                  except ValueError:
                      pass
              except Exception as e:
                  print(url, 'FAIL', e)
          EOF

      - name: Probe BC EPIC document API (Layer 1 recon)
        run: |
          python3 - <<'EOF'
          import json, urllib.request

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              return json.loads(urllib.request.urlopen(req, timeout=60).read())

          # take one known project id from the committed project list
          bc = json.load(open('data/raw/bc_epic_projects.json'))[0]['searchResults']
          pid = bc[0]['_id']
          print('probe project:', pid, bc[0]['name'])
          for url in (
              f"https://projects.eao.gov.bc.ca/api/public/search?dataset=Document&project={pid}&pageSize=5&pageNum=0",
              f"https://projects.eao.gov.bc.ca/api/v2/search?dataset=Document&project={pid}&pageSize=5",
          ):
              try:
                  d = get(url)
                  print(url[:80], '-> OK')
                  print(json.dumps(d)[:600])
                  break
              except Exception as e:
                  print(url[:80], 'FAIL', e)
          EOF

      - name: Fetch one Quebec fiche page (Layer 1 recon)
        run: |
          python3 - <<'EOF'
          import re, urllib.request
          h = open('data/raw/qc_ree_resultats.html', encoding='utf-8', errors='replace').read()
          d = sorted(set(re.findall(r'no_dossier=([^"&]+)', h)))[0]
          url = f"https://www.ree.environnement.gouv.qc.ca/fiche.asp?no_dossier={d}"
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          page = urllib.request.urlopen(req, timeout=60).read().decode('utf-8', 'replace')
          open('data/raw/qc_fiche_sample.html', 'w').write(page)
          print('saved fiche for', d, len(page), 'bytes')
          links = re.findall(r'href="([^"]+\.(?:pdf|PDF)[^"]*)"', page)
          print('pdf links on fiche:', len(links), links[:5])
          EOF

      - name: Commit data to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin claude/mac-mini-connection-ceehl5 || true
          git add data/raw
          git commit -m "Add phase-12 data (federal api-map with session, BC/QC doc recon) [skip ci]" || echo "nothing to commit"
          git push
