name: Fetch EA registry data

on:
  workflow_dispatch:
  push:
    branches: [claude/mac-mini-connection-ceehl5]
    paths: ['.github/workflows/fetch-ea-data.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download IAAC results JS (pagination logic)
        run: |
          mkdir -p data/raw
          curl -sL "https://iaac-aeic.gc.ca/050/evaluations/Scripts/PublicViews/Results/functions.js" -o data/raw/iaac_results_functions.js || true
          curl -sL "https://iaac-aeic.gc.ca/050/evaluations/Scripts/PublicViews/Results/site.js" -o data/raw/iaac_results_site.js || true
          wc -c data/raw/iaac_results_*.js
          echo "=== pagination-related lines ==="
          grep -nE "currentPage|GoToPage|function Search|exploration|ajax|XMLHttp|fetch\(" data/raw/iaac_results_functions.js data/raw/iaac_results_site.js | head -40 || true

      - name: Test pagination variants
        run: |
          python3 - <<'EOF'
          import re, urllib.request

          def get(url, data=None):
              req = urllib.request.Request(url, data=data, headers={'User-Agent': 'Mozilla/5.0'})
              return urllib.request.urlopen(req, timeout=60).read().decode('utf-8', 'replace')

          base = "https://iaac-aeic.gc.ca/050/evaluations/exploration"
          p1 = set()
          try:
              p1 = set(re.findall(r'/proj/(\d+)', get(base)))
              print('page1 ids:', len(p1))
          except Exception as e:
              print('page1 FAIL', e)
          variants = ["?page=2", "?pg=2", "?index=2", "?currentPage=2", "?p=2",
                      "?search=&page=2", "?search=&currentPage=2"]
          for v in variants:
              try:
                  ids = set(re.findall(r'/proj/(\d+)', get(base + v)))
                  print(f'{v}: HTTP OK, {len(ids)} ids, new vs p1: {len(ids - p1)}')
              except Exception as e:
                  print(f'{v}: FAIL {e}')
          try:
              body = "currentPage=2".encode()
              ids = set(re.findall(r'/proj/(\d+)', get(base, data=body)))
              print(f'POST currentPage=2: {len(ids)} ids, new: {len(ids - p1)}')
          except Exception as e:
              print('POST FAIL', e)
          EOF

      - name: Commit data to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin claude/mac-mini-connection-ceehl5 || true
          git add data/raw
          git commit -m "Add phase-10 IAAC pagination diagnostics [skip ci]" || echo "nothing to commit"
          git push
