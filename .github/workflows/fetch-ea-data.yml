name: Fetch EA registry data

on:
  workflow_dispatch:
  push:
    branches: [claude/mac-mini-connection-ceehl5]
    paths: ['.github/workflows/fetch-ea-data.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Harvest IAAC registry via exploration pages
        run: |
          mkdir -p data/raw
          python3 - <<'EOF'
          import json, re, urllib.request, html as H

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              return urllib.request.urlopen(req, timeout=60).read().decode('utf-8', 'replace')

          projects, page, empty = {}, 1, 0
          while empty < 2 and page < 400:
              try:
                  h = get(f"https://iaac-aeic.gc.ca/050/evaluations/exploration?page={page}")
              except Exception as e:
                  print('page', page, 'FAIL', e)
                  empty += 1
                  page += 1
                  continue
              found = 0
              # results are anchors to /proj/<id>; capture link text as name
              for m in re.finditer(r'href="https://iaac-aeic\.gc\.ca/050/evaluations/proj/(\d+)"[^>]*>(.*?)</a>', h, re.S):
                  pid = m.group(1)
                  name = re.sub(r'\s+', ' ', H.unescape(re.sub(r'<[^>]+>', ' ', m.group(2)))).strip()
                  if pid not in projects and name:
                      projects[pid] = {'name': name}
                      found += 1
              # try to grab metadata blocks near each link (status/province often in list items)
              empty = empty + 1 if found == 0 else 0
              if page % 10 == 0:
                  print(f'page {page}: total {len(projects)}')
              page += 1
          print('TOTAL projects:', len(projects))
          json.dump(projects, open('data/raw/federal_projects_index.json', 'w'), ensure_ascii=False)
          # save one page for structure analysis of metadata fields
          open('data/raw/iaac_exploration_p2.html', 'w').write(get("https://iaac-aeic.gc.ca/050/evaluations/exploration?page=2"))
          EOF

      - name: Commit data to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin claude/mac-mini-connection-ceehl5 || true
          git add data/raw
          git commit -m "Add phase-9 federal project index from exploration pages [skip ci]" || echo "nothing to commit"
          git push
