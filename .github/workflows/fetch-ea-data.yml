name: Fetch EA registry data

on:
  workflow_dispatch:
  push:
    branches: [claude/mac-mini-connection-ceehl5]
    paths: ['.github/workflows/fetch-ea-data.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch federal projects via exploration api-map
        run: |
          mkdir -p data/raw
          python3 - <<'EOF'
          import json, urllib.request, urllib.parse

          url = "https://iaac-aeic.gc.ca/050/evaluations/exploration/api-map"
          body = urllib.parse.urlencode({
              'search': '', 'facets': '', 'source': 'IAAC-AEIC',
              'dateFilter': '', 'projectID': '', 'useMap': 'false',
              'projectDocuments': '', 'activeProjects': 'true',
              'inactiveProjects': 'true', 'mostRecent': 'false',
          }).encode()
          req = urllib.request.Request(url, data=body, headers={
              'User-Agent': 'Mozilla/5.0',
              'X-Requested-With': 'XMLHttpRequest',
              'Referer': 'https://iaac-aeic.gc.ca/050/evaluations/exploration',
          })
          resp = urllib.request.urlopen(req, timeout=180).read().decode('utf-8', 'replace')
          print('response bytes:', len(resp))
          try:
              d = json.loads(resp)
              feats = d.get('features', [])
              print('features:', len(feats))
              if feats:
                  print('sample:', json.dumps(feats[0])[:400])
              open('data/raw/federal_apimap.geojson', 'w').write(resp)
          except Exception as e:
              print('not JSON:', e, resp[:300])
              open('data/raw/federal_apimap_error.txt', 'w').write(resp[:5000])
          EOF

      - name: Commit data to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin claude/mac-mini-connection-ceehl5 || true
          git add data/raw
          git commit -m "Add phase-11 federal projects from exploration api-map [skip ci]" || echo "nothing to commit"
          git push
