name: Fetch EA registry data

on:
  workflow_dispatch:
  push:
    branches: [claude/mac-mini-connection-ceehl5]
    paths: ['.github/workflows/fetch-ea-data.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Diagnose federal ArcGIS service and try alternates
        run: |
          mkdir -p data/raw
          BASE="https://maps-cartes.services.geo.ca/server_serveur/rest/services/IAAC/assessment_inventory_en/MapServer"
          echo "== layer 0 metadata =="
          curl -sL "$BASE/0?f=json" -o data/raw/federal_layer0_meta.json
          python3 -c "import json; d=json.load(open('data/raw/federal_layer0_meta.json')); print({k: d.get(k) for k in ('name','type','geometryType','supportsAdvancedQueries','supportedQueryFormats','capabilities','maxRecordCount')}); print('fields:', [f['name'] for f in d.get('fields', [])])"
          echo "== query variants =="
          for v in \
            "where=OBJECTID%3E0&outFields=OBJECTID&f=json" \
            "where=1%3D1&outFields=OBJECTID&f=pjson" \
            "where=1%3D1&outFields=*&f=json" \
            "text=&where=1%3D1&outFields=*&returnGeometry=true&f=json" \
            ; do
            echo "--- $v"
            curl -sL "$BASE/0/query?$v" | head -c 300
            echo
          done
          echo "== POST query =="
          curl -sL -X POST "$BASE/0/query" --data "where=1=1&outFields=*&returnGeometry=true&f=json" -o data/raw/federal_post_test.json
          head -c 300 data/raw/federal_post_test.json; echo

      - name: Try IAAC registry site exports
        run: |
          for u in \
            "https://iaac-aeic.gc.ca/050/evaluations/exploration?output=csv" \
            "https://iaac-aeic.gc.ca/050/evaluations/exploration.csv" \
            "https://iaac-aeic.gc.ca/050/evaluations/csv" \
            ; do
            echo "--- $u"
            curl -sL --max-time 60 -w "HTTP %{http_code} type %{content_type} size %{size_download}\n" -o /tmp/probe.out "$u" || true
            head -c 200 /tmp/probe.out; echo
          done
          curl -sL --max-time 60 "https://iaac-aeic.gc.ca/050/evaluations" -o data/raw/iaac_registry_home.html
          grep -oE '(api|API)[^"'"'"' ]*' data/raw/iaac_registry_home.html | sort -u | head -30 || true
          grep -oE 'src="[^"]+\.js[^"]*"' data/raw/iaac_registry_home.html | head -20 || true

      - name: Fetch Quebec REE full project list (empty keyword search)
        run: |
          curl -sL --max-time 120 -X POST "https://www.ree.environnement.gouv.qc.ca/resultats.asp" \
            --data "motcle=&region_adm=&Submit1=Rechercher" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -o data/raw/qc_ree_resultats.html || true
          wc -c data/raw/qc_ree_resultats.html

      - name: Commit data to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin claude/mac-mini-connection-ceehl5 || true
          git add data/raw
          git commit -m "Add phase-5 diagnostics (federal service meta, IAAC exports, QC REE results) [skip ci]" || echo "nothing to commit"
          git push
