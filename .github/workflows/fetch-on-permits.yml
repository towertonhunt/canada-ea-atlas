name: Fetch Ontario permitting data (ECA, mine closure)

on:
  workflow_dispatch:
  schedule:
    - cron: "29 9 * * *"
  push:
    branches: [claude/mac-mini-connection-ceehl5]
    paths: ['.github/workflows/fetch-on-permits.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/mac-mini-connection-ceehl5

      - name: Download AMIS sites and features KMZ
        continue-on-error: true
        run: |
          mkdir -p data/raw
          curl -sL --retry 3 --max-time 300 "http://www.geologyontario.mndm.gov.on.ca/mines/data/google/AMIS/KML/Sites/Sites2026.kmz" -o data/raw/on_amis_sites.kmz || true
          curl -sL --retry 3 --max-time 300 "http://www.geologyontario.mndm.gov.on.ca/mines/data/google/AMIS/KML/Features/Features2026.kmz" -o data/raw/on_amis_features.kmz || true
          ls -la data/raw/on_amis_*.kmz

      - name: Download compliance and financial assurance datasets
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import json, urllib.request, urllib.parse, re

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              return urllib.request.urlopen(req, timeout=120).read()

          ckan = "https://data.ontario.ca/api/3/action/package_show?id="
          for pkg in ('environmental-compliance-reports',
                      'financial-assurance-held-for-mining-companies',
                      'abandoned-mines-information'):
              try:
                  d = json.loads(get(ckan + pkg))
                  for r in d['result']['resources']:
                      fmt = (r.get('format') or '').lower()
                      if fmt not in ('csv', 'xlsx', 'kml', 'geojson', 'json'):
                          continue
                      name = re.sub(r'[^a-z0-9]+', '_', (r.get('name') or r['id']).lower())[:60]
                      dest = f'data/raw/onp_{pkg[:12]}_{name}.{fmt}'
                      try:
                          open(dest, 'wb').write(get(r['url']))
                          print('OK  ', dest)
                      except Exception as e:
                          print('FAIL', r['url'][:90], e)
              except Exception as e:
                  print('PKG FAIL', pkg, e)
          EOF
          ls -la data/raw/onp_* 2>/dev/null | head -20

      - name: Find and fetch active/producing mines datasets
        continue-on-error: true
        run: |
          python3 - <<'PYEOF'
          import json, re, urllib.request, urllib.parse

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              return urllib.request.urlopen(req, timeout=180).read()

          # NRCan 900A: principal mineral areas + producing mines (national)
          hits = {}
          for q in ('producing mines 900A', 'principal mineral areas producing mines'):
              try:
                  d = json.loads(get('https://open.canada.ca/data/api/3/action/package_search?rows=10&q=' +
                                     urllib.parse.quote(q)))
                  for pkg in d['result']['results']:
                      hits[pkg['name']] = [{'format': r.get('format'), 'url': r.get('url')}
                                           for r in pkg.get('resources', [])]
              except Exception as e:
                  print('search FAIL', q, e)
          json.dump(hits, open('data/raw/active_mines_datasets.json', 'w'))
          print('datasets:', list(hits))
          # grab first csv/geojson/kml resource we can find
          got = 0
          for name, res in hits.items():
              for r in res:
                  fmt = (r.get('format') or '').lower()
                  if fmt in ('csv', 'geojson', 'kml', 'json', 'shp', 'zip') and got < 4:
                      safe = re.sub(r'[^a-z0-9]+', '_', name)[:30]
                      dest = f'data/raw/mines900a_{safe}_{got}.{fmt}'
                      try:
                          data = get(r['url'])
                          open(dest, 'wb').write(data)
                          print('OK', dest, len(data), 'bytes <-', r['url'][:90])
                          got += 1
                      except Exception as e:
                          print('FAIL', r['url'][:90], str(e)[:60])
          PYEOF
          # Ontario OGSEarth active mines KML (same family as AMIS)
          UA="Mozilla/5.0"
          for u in \
            "http://www.geologyontario.mndm.gov.on.ca/mines/data/google/MinesActive/KML/Sites/Sites.kmz" \
            "http://www.geologyontario.mndm.gov.on.ca/mines/data/google/ogsearth2/files/ActiveMines.kml" \
            "https://www.geologyontario.mndm.gov.on.ca/mines/data/google/mines/Mines.kml" \
            ; do
            fn="data/raw/on_active_$(echo "$u" | md5sum | cut -c1-6).dat"
            code=$(curl -sL -o "$fn" -w "%{http_code}" --max-time 60 -A "$UA" "$u" || echo ERR)
            echo "$code $u -> $(wc -c < $fn) bytes"
          done

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git pull --rebase origin claude/mac-mini-connection-ceehl5 || true
            git add data/raw
            git commit -m "Add AMIS mines, compliance reports, financial assurance data [skip ci]" || echo "nothing to commit"
            git push && break
            sleep 7
          done
