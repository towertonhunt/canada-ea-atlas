name: Discover proponent-site documents

# Crawls proponent websites (data/raw/proponents/targets.json, ranked) for
# EA / Class EA documents that registries never receive -- the Hydro One
# pattern generalised. Discovery only: results land in
# data/raw/proponents/sites/<key>.json for review; archive_docs.py and the
# map pick them up in a later step once a site's inventory is accepted.

on:
  workflow_dispatch:
    inputs:
      top:
        description: 'How many ranked sites to (re)crawl'
        default: '40'
      refresh:
        description: 'Recrawl sites that already have a result'
        type: boolean
        default: false
  schedule:
    - cron: '23 3 * * 0'   # weekly, Sunday 03:23 UTC

permissions:
  contents: write

concurrency:
  group: discover-proponents
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild target list (no lookup)
        run: python3 scripts/build_proponent_targets.py --no-lookup

      # Several major proponents (OPG, Bruce Power, Suncor, LNG Canada...) sit
      # behind bot walls or serve JS shells; the crawler falls back to a
      # headless Chromium for those (--browser).
      - name: Install headless Chromium
        run: |
          python3 -m pip install -q playwright
          python3 -m playwright install --with-deps chromium >/dev/null

      - name: Crawl
        run: |
          ARGS="--top ${{ inputs.top || '40' }} --budget 16000 --browser"
          [ "${{ inputs.refresh }}" = "true" ] && ARGS="$ARGS --refresh"
          python3 scripts/proponent_discover.py $ARGS

      # The Internet Archive's index of each host: recovers removed files and
      # covers sites that block crawlers. Slow (CDX rate limits); budgeted.
      - name: Wayback index harvest
        continue-on-error: true
        timeout-minutes: 90
        run: python3 scripts/proponent_wayback.py --top 60

      # Promote EA-typed documents onto the map (matched to projects where
      # the project name appears; otherwise per-proponent libraries) and
      # rebuild. The archive lane then mirrors them like any other catalogue.
      - name: Promote and rebuild
        run: |
          python3 scripts/promote_proponent_docs.py
          python3 scripts/split_doc_catalogues.py --archive-only
          python3 scripts/build_national_geojson.py
          python3 scripts/build_api.py
          python3 scripts/validate_data.py || true

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git stash -q || true
            git reset -q --hard origin/main
            git stash pop -q || true
            git add data/raw/proponents data/raw/proponent_docs_index.json data/raw/proponent_libraries.json \
                    data/docs/proponent data/projects_canada.geojson data/api
            git commit -m "Proponent discovery + promotion [skip ci]" || { echo "nothing to commit"; break; }
            git push && break
            sleep 7
          done
