name: Fetch Wawa-Timmins routing layers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/fetch-routing-layers.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Locate layer endpoints (GeoHub DCAT, extended targets)
        continue-on-error: true
        run: |
          mkdir -p routing/layers
          python3 -u - <<'PYEOF'
          import json, urllib.request

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              return json.loads(urllib.request.urlopen(req, timeout=300).read())

          TARGETS = ['wetland', 'areas of natural and scientific', 'first nation reserve',
                     'conservation reserve', 'waterbody', 'watercourse', 'utility line',
                     'ontario road network', 'railway', 'rail net', 'airport',
                     'crown land use policy', 'mining claim', 'aggregate site',
                     'natural heritage system', 'wildlife area', 'game preserve',
                     'provincial park', 'built-up area', 'building']
          hits = []
          cat = get('https://geohub.lio.gov.on.ca/api/feed/dcat-us/1.1.json')
          for d in cat.get('dataset', []):
              t = (d.get('title') or '').lower()
              if any(k in t for k in TARGETS):
                  rest = [x.get('accessURL') or x.get('downloadURL')
                          for x in d.get('distribution', [])
                          if 'rest/services' in ((x.get('accessURL') or x.get('downloadURL') or ''))]
                  if rest:
                      hits.append({'title': d.get('title'), 'rest': rest[0]})
          json.dump(hits, open('routing/layers/endpoints.json', 'w'), ensure_ascii=False, indent=1)
          print(len(hits), 'candidate layer services')
          for h in hits[:40]:
              print('-', h['title'][:60], '::', h['rest'][:80])
          PYEOF

      - name: Clip layers to Wawa-Timmins AOI
        continue-on-error: true
        run: |
          python3 -u - <<'PYEOF'
          import json, re, time, urllib.parse, urllib.request

          fw = json.load(open('routing/framework.json'))
          aoi = fw['aoi']
          env = json.dumps({'xmin': aoi['lon_min'], 'ymin': aoi['lat_min'],
                            'xmax': aoi['lon_max'], 'ymax': aoi['lat_max'],
                            'spatialReference': {'wkid': 4326}})
          eps = json.load(open('routing/layers/endpoints.json'))

          def get(url, tries=3):
              for t in range(tries):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                      return json.loads(urllib.request.urlopen(req, timeout=300).read())
                  except Exception:
                      if t == tries - 1:
                          raise
                      time.sleep(10)

          def layer_url(service):
              base = service.split('?')[0].rstrip('/')
              if re.search(r'/\d+$', base):
                  return base
              meta = get(base + '?f=json')
              lyrs = meta.get('layers') or []
              return f"{base}/{lyrs[0]['id']}" if lyrs else None

          for spec in fw['layers']:
              if spec.get('local'):
                  continue
              match = spec['match']
              cand = [e for e in eps if match in e['title'].lower()] or \
                     ([e for e in eps if spec.get('fallback_match', '~') in e['title'].lower()])
              if not cand:
                  print('NO ENDPOINT:', spec['key'])
                  continue
              try:
                  lu = layer_url(cand[0]['rest'])
                  if not lu:
                      print('NO LAYER:', spec['key'])
                      continue
                  feats, offset = [], 0
                  while True:
                      q = (f"{lu}/query?where=1%3D1&geometry={urllib.parse.quote(env)}"
                           f"&geometryType=esriGeometryEnvelope&inSR=4326&spatialRel=esriSpatialRelIntersects"
                           f"&outFields=OBJECTID&outSR=4326&f=geojson"
                           f"&resultOffset={offset}&resultRecordCount=1000")
                      d = get(q)
                      fs = d.get('features', [])
                      feats += fs
                      if len(fs) < 1000 or len(feats) > 60000:
                          break
                      offset += 1000
                  out = f"routing/layers/{spec['key']}.geojson"
                  json.dump({'type': 'FeatureCollection', 'features': feats}, open(out, 'w'))
                  print(f"{spec['key']}: {len(feats)} features <- {cand[0]['title'][:50]}")
              except Exception as e:
                  print(spec['key'], 'FAIL', str(e)[:120])
              time.sleep(2)
          PYEOF
          du -sh routing/layers/ 2>/dev/null; ls -la routing/layers/ | head -25

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            git add routing
            git commit -m "Add Wawa-Timmins routing layer clips [skip ci]" || echo "nothing to commit"
            git push && break
            sleep 7
          done
